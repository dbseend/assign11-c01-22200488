<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>자료 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width:900px"><a th:href="@{/posts}">← 자료 목록</a>
    <div class="card shadow-sm mt-3">
        <div class="card-body p-4">
            <div class="eyebrow" th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}">작성일</div>
            <h1 th:text="${post.title}">게시글 제목</h1>
            <p class="post-content" th:text="${post.content}">게시글 내용</p>
            <hr>
            <h5>첨부파일 <span class="text-secondary" th:text="${#lists.size(post.attachments)}">0</span></h5>
            <p class="text-secondary" th:if="${#lists.isEmpty(post.attachments)}">첨부파일이 없습니다.</p>
            <ul class="list-group" th:if="${!#lists.isEmpty(post.attachments)}">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    th:each="file : ${post.attachments}">
                    <div><span class="badge file-type"
                               th:text="${file.originalFilename.substring(file.originalFilename.lastIndexOf('.') + 1).toUpperCase()}">PDF</span><strong
                            class="ms-2" th:text="${file.originalFilename}">sample.pdf</strong><small
                            class="ms-2 text-secondary"
                            th:text="${file.fileSize ge 1048576 ? #numbers.formatDecimal(file.fileSize / 1048576.0, 1, 1) + ' MB' : #numbers.formatDecimal(file.fileSize / 1024.0, 1, 1) + ' KB'}">크기</small>
                    </div>
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/attachments/{id}/download(id=${file.id})}">⬇
                        다운로드</a></li>
            </ul>
            <!-- 이미지 미리보기: contentType이 image/로 시작하는 첨부만 표시. PDF 등은 위 목록의 다운로드 버튼 그대로 사용 -->
            <div class="mt-3" th:each="file : ${post.attachments}"
                 th:if="${#strings.startsWith(file.contentType, 'image/')}">
                <div class="small text-secondary mb-1" th:text="'🖼 미리보기 · ' + ${file.originalFilename}">미리보기</div>
                <img class="preview-img" th:src="@{/attachments/{id}/view(id=${file.id})}"
                     th:alt="${file.originalFilename}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="text-danger small" style="display:none">이미지를 불러올 수 없습니다. (파일이 없거나 삭제되었습니다)</div>
            </div>
            <div class="d-flex gap-2 mt-4"><a class="btn btn-outline-secondary"
                                              th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a>
                <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
                      onsubmit="return confirm('게시글을 삭제할까요?')">
                    <button class="btn btn-outline-danger">삭제</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
