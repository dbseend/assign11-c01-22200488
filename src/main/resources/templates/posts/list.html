<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HGU 자료실</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5 list-page">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="eyebrow">WEB SERVICE DEVELOPMENT · WEEK 11</div>
            <h1>HGU 자료실</h1>
            <p class="summary mb-0">등록된 자료 <strong th:text="${#lists.size(posts)}">0</strong>건 · 문서, 이미지, PDF를 한곳에서
                공유하세요.</p></div>
        <a class="btn btn-primary" th:href="@{/posts/new}">+ 새 자료 올리기</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead>
                <tr>
                    <th class="ps-4">번호</th>
                    <th>제목</th>
                    <th>첨부파일</th>
                    <th>작성일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${posts}">
                    <td class="ps-4" th:text="${p.id}">1</td>
                    <td><a th:href="@{/posts/{id}(id=${p.id})}" th:text="${p.title}">제목</a></td>
                    <td><span class="badge-file" th:text="'📎 ' + ${#lists.size(p.attachments)} + '개'">📎 0개</span></td>
                    <td th:text="${#temporals.format(p.createdAt,'yyyy-MM-dd HH:mm')}">날짜</td>
                </tr>
                <tr th:if="${#lists.isEmpty(posts)}">
                    <td colspan="4" class="text-center text-secondary p-5">아직 등록된 자료가 없습니다. 첫 자료를 올려 보세요.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
